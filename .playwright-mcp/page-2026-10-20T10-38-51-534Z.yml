          - heading [level=3] [ref=f5e575]:
            - button "How much does painting cost?" [expanded] [ref=f5e576]
          - paragraph [ref=f5e582]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f5e584]:
          - heading [level=3] [ref=f5e585]:
            - button "Do you give free quotes?" [ref=f5e586]
          - paragraph [ref=f5e590]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f5e592]:
          - heading [level=3] [ref=f5e593]:
            - button "What areas do you serve?" [ref=f5e594]
          - paragraph [ref=f5e598]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f5e600]:
          - heading [level=3] [ref=f5e601]:
            - button "How long does a job take?" [ref=f5e602]
          - paragraph [ref=f5e606]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f5e608]:
          - heading [level=3] [ref=f5e609]:
            - button "Which paints do you use?" [ref=f5e610]
          - paragraph [ref=f5e614]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f5e616]:
          - heading [level=3] [ref=f5e617]:
            - button "Do I need to be home?" [ref=f5e618]
          - paragraph [ref=f5e622]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f5e624]:
          - heading [level=3] [ref=f5e625]:
            - button "Can you help me choose colours?" [ref=f5e626]
          - paragraph [ref=f5e630]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
