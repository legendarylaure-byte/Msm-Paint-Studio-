      - generic [ref=f7e577]:
        - generic [ref=f7e579]:
          - heading [level=3] [ref=f7e580]:
            - button "How much does painting cost?" [expanded] [ref=f7e581]
          - paragraph [ref=f7e587]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f7e589]:
          - heading [level=3] [ref=f7e590]:
            - button "Do you give free quotes?" [ref=f7e591]
          - paragraph [ref=f7e595]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f7e597]:
          - heading [level=3] [ref=f7e598]:
            - button "What areas do you serve?" [ref=f7e599]
          - paragraph [ref=f7e603]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f7e605]:
          - heading [level=3] [ref=f7e606]:
            - button "How long does a job take?" [ref=f7e607]
          - paragraph [ref=f7e611]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f7e613]:
          - heading [level=3] [ref=f7e614]:
            - button "Which paints do you use?" [ref=f7e615]
          - paragraph [ref=f7e619]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f7e621]:
          - heading [level=3] [ref=f7e622]:
            - button "Do I need to be home?" [ref=f7e623]
          - paragraph [ref=f7e627]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f7e629]:
          - heading [level=3] [ref=f7e630]:
            - button "Can you help me choose colours?" [ref=f7e631]
          - paragraph [ref=f7e635]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
        - generic [ref=f7e637]:
          - heading [level=3] [ref=f7e638]:
            - button "Are you insured?" [ref=f7e639]
          - paragraph [ref=f7e643]: Yes — MSM Painting Studio carries full public liability cover. Certificates can be provided on request before any work begins.
