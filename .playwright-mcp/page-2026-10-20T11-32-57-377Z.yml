        - generic [ref=f8e579]:
          - heading [level=3] [ref=f8e580]:
            - button "How much does painting cost?" [expanded] [ref=f8e581]
          - paragraph [ref=f8e587]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f8e589]:
          - heading [level=3] [ref=f8e590]:
            - button "Do you give free quotes?" [ref=f8e591]
          - paragraph [ref=f8e595]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f8e597]:
          - heading [level=3] [ref=f8e598]:
            - button "What areas do you serve?" [ref=f8e599]
          - paragraph [ref=f8e603]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f8e605]:
          - heading [level=3] [ref=f8e606]:
            - button "How long does a job take?" [ref=f8e607]
          - paragraph [ref=f8e611]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f8e613]:
          - heading [level=3] [ref=f8e614]:
            - button "Which paints do you use?" [ref=f8e615]
          - paragraph [ref=f8e619]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f8e621]:
          - heading [level=3] [ref=f8e622]:
            - button "Do I need to be home?" [ref=f8e623]
          - paragraph [ref=f8e627]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f8e629]:
          - heading [level=3] [ref=f8e630]:
            - button "Can you help me choose colours?" [ref=f8e631]
          - paragraph [ref=f8e635]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
        - generic [ref=f8e637]:
          - heading [level=3] [ref=f8e638]:
            - button "Are you insured?" [ref=f8e639]
          - paragraph [ref=f8e643]: Yes — MSM Painting Studio carries full public liability cover. Certificates can be provided on request before any work begins.
