        - paragraph [ref=f5e1407]: Straight answers on price, timing and what to expect. Anything else — just open the chat.
      - generic [ref=f5e1408]:
        - generic [ref=f5e1410]:
          - heading [level=3] [ref=f5e1411]:
            - button "How much does painting cost?" [expanded] [ref=f5e1412]
          - paragraph [ref=f5e1418]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f5e1420]:
          - heading [level=3] [ref=f5e1421]:
            - button "Do you give free quotes?" [ref=f5e1422]
          - paragraph [ref=f5e1426]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f5e1428]:
          - heading [level=3] [ref=f5e1429]:
            - button "What areas do you serve?" [ref=f5e1430]
          - paragraph [ref=f5e1434]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f5e1436]:
          - heading [level=3] [ref=f5e1437]:
            - button "How long does a job take?" [ref=f5e1438]
          - paragraph [ref=f5e1442]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f5e1444]:
          - heading [level=3] [ref=f5e1445]:
            - button "Which paints do you use?" [ref=f5e1446]
          - paragraph [ref=f5e1450]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f5e1452]:
          - heading [level=3] [ref=f5e1453]:
            - button "Do I need to be home?" [ref=f5e1454]
          - paragraph [ref=f5e1458]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f5e1460]:
          - heading [level=3] [ref=f5e1461]:
            - button "Can you help me choose colours?" [ref=f5e1462]
          - paragraph [ref=f5e1466]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
        - generic [ref=f5e1468]:
          - heading [level=3] [ref=f5e1469]:
            - button "Are you insured?" [ref=f5e1470]
          - paragraph [ref=f5e1474]: Yes — MSM Painting Studio carries full public liability cover. Certificates can be provided on request before any work begins.
