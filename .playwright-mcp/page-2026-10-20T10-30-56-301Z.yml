          - heading [level=3] [ref=f3e576]:
            - button "How much does painting cost?" [expanded] [ref=f3e577]
          - paragraph [ref=f3e583]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f3e585]:
          - heading [level=3] [ref=f3e586]:
            - button "Do you give free quotes?" [ref=f3e587]
          - paragraph [ref=f3e591]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f3e593]:
          - heading [level=3] [ref=f3e594]:
            - button "What areas do you serve?" [ref=f3e595]
          - paragraph [ref=f3e599]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f3e601]:
          - heading [level=3] [ref=f3e602]:
            - button "How long does a job take?" [ref=f3e603]
          - paragraph [ref=f3e607]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f3e609]:
          - heading [level=3] [ref=f3e610]:
            - button "Which paints do you use?" [ref=f3e611]
          - paragraph [ref=f3e615]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f3e617]:
          - heading [level=3] [ref=f3e618]:
            - button "Do I need to be home?" [ref=f3e619]
          - paragraph [ref=f3e623]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f3e625]:
          - heading [level=3] [ref=f3e626]:
            - button "Can you help me choose colours?" [ref=f3e627]
          - paragraph [ref=f3e631]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
