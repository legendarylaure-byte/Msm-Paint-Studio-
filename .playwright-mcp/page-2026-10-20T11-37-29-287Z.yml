      - generic [ref=f10e577]:
        - generic [ref=f10e579]:
          - heading [level=3] [ref=f10e580]:
            - button "How much does painting cost?" [expanded] [ref=f10e581]
          - paragraph [ref=f10e587]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f10e589]:
          - heading [level=3] [ref=f10e590]:
            - button "Do you give free quotes?" [ref=f10e591]
          - paragraph [ref=f10e595]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f10e597]:
          - heading [level=3] [ref=f10e598]:
            - button "What areas do you serve?" [ref=f10e599]
          - paragraph [ref=f10e603]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f10e605]:
          - heading [level=3] [ref=f10e606]:
            - button "How long does a job take?" [ref=f10e607]
          - paragraph [ref=f10e611]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f10e613]:
          - heading [level=3] [ref=f10e614]:
            - button "Which paints do you use?" [ref=f10e615]
          - paragraph [ref=f10e619]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f10e621]:
          - heading [level=3] [ref=f10e622]:
            - button "Do I need to be home?" [ref=f10e623]
          - paragraph [ref=f10e627]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f10e629]:
          - heading [level=3] [ref=f10e630]:
            - button "Can you help me choose colours?" [ref=f10e631]
          - paragraph [ref=f10e635]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
        - generic [ref=f10e637]:
          - heading [level=3] [ref=f10e638]:
            - button "Are you insured?" [ref=f10e639]
          - paragraph [ref=f10e643]: Yes — MSM Painting Studio carries full public liability cover. Certificates can be provided on request before any work begins.
