      - generic [ref=f4e585]:
        - generic [ref=f4e587]:
          - heading [level=3] [ref=f4e588]:
            - button "How much does painting cost?" [expanded] [ref=f4e589]
          - paragraph [ref=f4e595]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f4e597]:
          - heading [level=3] [ref=f4e598]:
            - button "Do you give free quotes?" [ref=f4e599]
          - paragraph [ref=f4e603]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f4e605]:
          - heading [level=3] [ref=f4e606]:
            - button "What areas do you serve?" [ref=f4e607]
          - paragraph [ref=f4e611]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f4e613]:
          - heading [level=3] [ref=f4e614]:
            - button "How long does a job take?" [ref=f4e615]
          - paragraph [ref=f4e619]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f4e621]:
          - heading [level=3] [ref=f4e622]:
            - button "Which paints do you use?" [ref=f4e623]
          - paragraph [ref=f4e627]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f4e629]:
          - heading [level=3] [ref=f4e630]:
            - button "Do I need to be home?" [ref=f4e631]
          - paragraph [ref=f4e635]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f4e637]:
          - heading [level=3] [ref=f4e638]:
            - button "Can you help me choose colours?" [ref=f4e639]
          - paragraph [ref=f4e643]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
        - generic [ref=f4e645]:
          - heading [level=3] [ref=f4e646]:
            - button "Are you insured?" [ref=f4e647]
          - paragraph [ref=f4e651]: Yes — MSM Painting Studio carries full public liability cover. Certificates can be provided on request before any work begins.
