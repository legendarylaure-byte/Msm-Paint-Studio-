            - button "What areas do you serve?" [ref=e451]
          - paragraph [ref=e455]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=e457]:
          - heading [level=3] [ref=e458]:
            - button "How long does a job take?" [ref=e459]
          - paragraph [ref=e463]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
