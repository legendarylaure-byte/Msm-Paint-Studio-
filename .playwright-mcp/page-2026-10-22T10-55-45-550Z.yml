            - button "How much does painting cost?" [expanded] [ref=e433]
          - paragraph [ref=e439]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
