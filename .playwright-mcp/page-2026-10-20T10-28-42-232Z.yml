            - button "How much does painting cost?" [expanded] [ref=f1e576]
          - paragraph [ref=f1e582]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f1e584]:
          - heading [level=3] [ref=f1e585]:
            - button "Do you give free quotes?" [ref=f1e586]
          - paragraph [ref=f1e590]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f1e592]:
          - heading [level=3] [ref=f1e593]:
            - button "What areas do you serve?" [ref=f1e594]
          - paragraph [ref=f1e598]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f1e600]:
          - heading [level=3] [ref=f1e601]:
            - button "How long does a job take?" [ref=f1e602]
          - paragraph [ref=f1e606]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
