          - heading [level=3] [ref=f1e609]:
            - button "Which paints do you use?" [ref=f1e610]
          - paragraph [ref=f1e614]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f1e616]:
          - heading [level=3] [ref=f1e617]:
            - button "Do I need to be home?" [ref=f1e618]
          - paragraph [ref=f1e622]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f1e624]:
