          - heading [level=3] [ref=f2e575]:
            - button "How much does painting cost?" [expanded] [ref=f2e576]
          - paragraph [ref=f2e582]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f2e584]:
          - heading [level=3] [ref=f2e585]:
            - button "Do you give free quotes?" [ref=f2e586]
          - paragraph [ref=f2e590]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f2e592]:
          - heading [level=3] [ref=f2e593]:
            - button "What areas do you serve?" [ref=f2e594]
          - paragraph [ref=f2e598]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f2e600]:
          - heading [level=3] [ref=f2e601]:
            - button "How long does a job take?" [ref=f2e602]
          - paragraph [ref=f2e606]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f2e608]:
          - heading [level=3] [ref=f2e609]:
            - button "Which paints do you use?" [ref=f2e610]
          - paragraph [ref=f2e614]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f2e616]:
          - heading [level=3] [ref=f2e617]:
            - button "Do I need to be home?" [ref=f2e618]
          - paragraph [ref=f2e622]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f2e624]:
