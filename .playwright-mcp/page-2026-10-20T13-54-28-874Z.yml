      - generic [ref=f6e585]:
        - generic [ref=f6e587]:
          - heading [level=3] [ref=f6e588]:
            - button "How much does painting cost?" [expanded] [ref=f6e589]
          - paragraph [ref=f6e595]: It depends on size, surface condition and paint choice — that's why every quote is free and itemised. As a guide, a standard bedroom usually starts in the low hundreds, while full interiors and exteriors are quoted after a quick look. No hidden extras, ever.
        - generic [ref=f6e597]:
          - heading [level=3] [ref=f6e598]:
            - button "Do you give free quotes?" [ref=f6e599]
          - paragraph [ref=f6e603]: Yes — every quote is free and no-obligation. Book online, send photos through the chat, or just call. Most quotes come back within one business day.
        - generic [ref=f6e605]:
          - heading [level=3] [ref=f6e606]:
            - button "What areas do you serve?" [ref=f6e607]
          - paragraph [ref=f6e611]: Berwick is home base, and we cover all of Casey–Cardinia — Narre Warren, Cranbourne, Pakenham, Beaconsfield, Officer — plus greater Melbourne. Not sure if you're in range? Ask us.
        - generic [ref=f6e613]:
          - heading [level=3] [ref=f6e614]:
            - button "How long does a job take?" [ref=f6e615]
          - paragraph [ref=f6e619]: A single room is often done in a day. Full interiors usually run 2–5 days depending on size and prep. Exteriors depend on weather. We'll give you a clear timeline before we start.
        - generic [ref=f6e621]:
          - heading [level=3] [ref=f6e622]:
            - button "Which paints do you use?" [ref=f6e623]
          - paragraph [ref=f6e627]: Quality, trusted brands suited to each surface — low-odour and low-VOC options for interiors, and UV-stable coatings outside. Happy to work with a specific colour or product you've chosen.
        - generic [ref=f6e629]:
          - heading [level=3] [ref=f6e630]:
            - button "Do I need to be home?" [ref=f6e631]
          - paragraph [ref=f6e635]: For the quote, it helps if someone walks us through. During the job, most clients go to work and come home to a transformed space. We're fully happy to coordinate keys or access.
        - generic [ref=f6e637]:
          - heading [level=3] [ref=f6e638]:
            - button "Can you help me choose colours?" [ref=f6e639]
          - paragraph [ref=f6e643]: Absolutely — colour advice comes free with every quote. Bring a cushion, a tile or a photo and we'll build a palette that flows through the whole home.
        - generic [ref=f6e645]:
          - heading [level=3] [ref=f6e646]:
            - button "Are you insured?" [ref=f6e647]
          - paragraph [ref=f6e651]: Yes — MSM Painting Studio carries full public liability cover. Certificates can be provided on request before any work begins.
